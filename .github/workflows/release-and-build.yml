name: Release & Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: posturetracker
  APP_NAME: Posture Tracker

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Cargo.toml version changed
        id: version_check
        run: |
          CURRENT_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version\s*=\s*"(.*)"/\1/')
          git show HEAD~1:Cargo.toml > /tmp/prev_cargo.toml 2>/dev/null || echo "" > /tmp/prev_cargo.toml
          PREV_VERSION=$(grep -m1 '^version' /tmp/prev_cargo.toml | sed -E 's/version\s*=\s*"(.*)"/\1/' || echo "")

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREV_VERSION"

          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ needs.version-check.outputs.tag }}"
          git push origin "${{ needs.version-check.outputs.tag }}"

  build:
    needs: [version-check, tag]
    if: needs.version-check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Bumped suffix to invalidate older caches that recorded a now-dangling ort download
          # path (see cache-directories note below).
          key: ${{ matrix.target }}-v2
          # ort downloads the prebuilt ONNX Runtime into an OS cache dir OUTSIDE target/.
          # rust-cache restores target/ (so ort-sys's build script is skipped as up-to-date),
          # but on a fresh runner that external dir is gone, leaving a dangling link-search path
          # and a "library 'onnxruntime' not found" failure. Cache it alongside so the two stay
          # in sync. (Harmless on the Intel job, which links a from-source build instead.)
          cache-directories: |
            ~/Library/Caches/ort.pyke.io
            ~/.cache/ort.pyke.io

      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      # ---------- macOS: work around ort-sys's broken clang_rt.osx search path ----------
      # ort-sys statically links `-lclang_rt.osx` and guesses its directory from
      # `clang --print-search-dirs`, but that guess is wrong on newer Xcode (e.g. 26.5), so the
      # linker fails with "library 'clang_rt.osx' not found". Locate the real fat archive
      # (covers both arm64 and x86_64) and add its dir to the link search path.
      - name: Fix clang_rt.osx link path (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          clang_dir="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang"
          rt="$(find "$clang_dir" -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)"
          if [ -z "$rt" ]; then
            rt="$(find "$(xcode-select -p)" -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)"
          fi
          if [ -z "$rt" ]; then
            echo "::error::libclang_rt.osx.a not found under $(xcode-select -p)"
            exit 1
          fi
          echo "Found compiler-rt: $rt"
          echo "RUSTFLAGS=-L native=$(dirname "$rt") ${RUSTFLAGS:-}" >> "$GITHUB_ENV"

      # ---------- Intel Mac: ort ships no prebuilt ONNX Runtime for x86_64-apple-darwin ----------
      # ort-sys 2.0.0-rc.12 expects ONNX Runtime 1.24.2. We build it from source as a *shared*
      # library and link ort against it dynamically. (Static linking is impractical here: ort-sys
      # hard-codes a static-deps list — re2, abseil, nsync, ... — matching its own prebuild config,
      # which a stock `build.py` build doesn't reproduce.) The resulting libonnxruntime.dylib
      # bundles those deps internally, so ort only needs to link the single dylib.
      - name: Cache ONNX Runtime build (Intel Mac)
        if: matrix.target == 'x86_64-apple-darwin'
        id: ort-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onnxruntime/build/Release
          key: onnxruntime-1.24.2-x86_64-apple-darwin-shared

      - name: Build ONNX Runtime from source (Intel Mac)
        if: matrix.target == 'x86_64-apple-darwin' && steps.ort-build-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          brew install cmake
          git clone --depth 1 --branch v1.24.2 --recurse-submodules --shallow-submodules \
            https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          # Cross-compile for x86_64 from the arm64 runner; --skip_tests because we can't run
          # the x86_64 test binaries here. --build_shared_lib produces libonnxruntime.dylib.
          python3 "$RUNNER_TEMP/onnxruntime/tools/ci_build/build.py" \
            --build_dir "$RUNNER_TEMP/onnxruntime/build" \
            --config Release \
            --parallel \
            --osx_arch x86_64 \
            --build_shared_lib \
            --skip_tests \
            --skip_submodule_sync \
            --compile_no_warning_as_error \
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Point ort at the from-source ONNX Runtime (Intel Mac)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          ort_root="$RUNNER_TEMP/onnxruntime/build/Release"
          if ! ls "$ort_root"/libonnxruntime*.dylib >/dev/null 2>&1; then
            echo "::error::libonnxruntime.dylib not found under $ort_root"
            exit 1
          fi
          # ORT_PREFER_DYNAMIC_LINK makes ort-sys emit just `-l onnxruntime` against this dir
          # instead of trying to statically link the bundled deps.
          echo "ORT_LIB_LOCATION=$ort_root" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      # ccap-rs always compiles its AVX2 translation unit for x86_64 but only adds -mavx2 when its
      # build script's HOST arch is x86 (a cc `#[cfg(target_arch)]` bug). Cross-compiling from the
      # arm64 runner, the flags are dropped and the intrinsics fail to compile. Force the AVX2
      # baseline via a target-scoped CXXFLAGS — safe here since every Intel Mac on macOS 11+ (this
      # build's minimum) is Haswell or newer and supports AVX2.
      - name: Enable AVX2 for ccap-rs C++ build (Intel Mac)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          echo "CXXFLAGS_x86_64-apple-darwin=-mavx2 -mfma" >> "$GITHUB_ENV"
          echo "CXXFLAGS_x86_64_apple_darwin=-mavx2 -mfma" >> "$GITHUB_ENV"

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- Linux: build .deb package ----------
      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-24.04'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.os == 'ubuntu-24.04'
        run: cargo deb --target ${{ matrix.target }} --no-build

      - name: Upload .deb artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}-deb
          path: target/${{ matrix.target }}/debian/*.deb

      # ---------- Linux: raw binary ----------
      - name: Package Linux binary
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} dist/
          tar -czf dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.tar.gz -C dist ${{ env.BIN_NAME }}

      - name: Upload Linux binary artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}-binary
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.tar.gz

      # ---------- Windows: Authenticode code-signing ----------
      # Signs the release .exe with signtool so Windows SmartScreen names a verified
      # publisher instead of warning about an "unknown publisher". This is gated on the
      # signing secrets being present, so it is a no-op (just a notice) until a code-signing
      # certificate is purchased and the secrets below are configured in the repo:
      #   WINDOWS_CERT_BASE64    - base64-encoded PFX/P12 certificate
      #   WINDOWS_CERT_PASSWORD  - password for the PFX
      # Note: hardware-token / cloud-HSM EV certificates that cannot be exported to a PFX
      # require a different signing tool (e.g. AzureSignTool) wired in place of signtool.
      - name: Sign Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe"
          if (-not $env:WINDOWS_CERT_BASE64) {
            Write-Host "::notice::No WINDOWS_CERT_BASE64 secret configured; shipping an UNSIGNED .exe (SmartScreen will warn)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /d "${{ env.APP_NAME }}" $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
          Remove-Item $pfx -Force

      - name: Verify Windows signature
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERT_BASE64) {
            Write-Host "::notice::Skipping signature verification (no certificate configured)."
            exit 0
          }
          $exe = "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe"
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Select-Object -Last 1 -ExpandProperty FullName
          & $signtool verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed with exit code $LASTEXITCODE" }

      # ---------- Windows: package .exe ----------
      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "dist/"
          Compress-Archive -Path "dist/${{ env.BIN_NAME }}.exe" -DestinationPath "dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip"

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip

      # ---------- macOS: build .app bundle ----------
      - name: Build .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          APP_DIR="dist/${{ env.APP_NAME }}.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} "$APP_DIR/Contents/MacOS/"
          # The Dock and Finder both read the bundle icon named by CFBundleIconFile below;
          # macOS ignores the per-window icon the app sets at runtime.
          cp assets/icons/app/app-icon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          # Intel build links libonnxruntime.dylib dynamically, so ship it inside the bundle and
          # repoint the executable at @rpath/@executable_path so dyld finds it next to the binary.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            bin="$APP_DIR/Contents/MacOS/${{ env.BIN_NAME }}"
            cp -L "$RUNNER_TEMP"/onnxruntime/build/Release/libonnxruntime*.dylib "$APP_DIR/Contents/MacOS/"
            dep="$(otool -L "$bin" | awk '/libonnxruntime/{print $1; exit}')"
            if [ -z "$dep" ]; then echo "::error::binary has no libonnxruntime dependency"; exit 1; fi
            base="$(basename "$dep")"
            install_name_tool -id "@rpath/$base" "$APP_DIR/Contents/MacOS/$base"
            install_name_tool -change "$dep" "@rpath/$base" "$bin"
            install_name_tool -add_rpath @executable_path "$bin"
            # install_name_tool invalidates signatures, so (ad-hoc) re-sign the dylib(s) first;
            # the whole bundle is sealed further down (inside-out signing).
            for dylib in "$APP_DIR/Contents/MacOS/"libonnxruntime*.dylib; do
              codesign --force --sign - "$dylib"
            done
          fi
          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ env.BIN_NAME }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.${{ env.BIN_NAME }}</string>
              <key>CFBundleName</key>
              <string>${{ env.APP_NAME }}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.version-check.outputs.version }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.version-check.outputs.version }}</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSCameraUsageDescription</key>
              <string>${{ env.APP_NAME }} uses the camera to detect and track your posture. Video is processed locally and never leaves your device.</string>
          </dict>
          </plist>
          EOF
          # Ad-hoc sign (`-`) the whole bundle now that Info.plist and any nested dylibs are in
          # place. This seals the bundle so it isn't seen as tampered/inconsistent, but it does
          # NOT satisfy Gatekeeper for downloaded apps — that requires a Developer ID signature +
          # Apple notarization. Until then, users must clear the quarantine attribute on first
          # launch; see the macOS install steps in README.md.
          codesign --force --sign - "$APP_DIR"
          codesign --verify --strict --verbose=2 "$APP_DIR"
          cd dist
          zip -r "${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip" "${{ env.APP_NAME }}.app"

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip

  release:
    needs: [version-check, build]
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          name: ${{ needs.version-check.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
          body: |
            ### First launch notes
            These builds are not yet code-signed/notarized, so the OS may warn on first launch.
            This is expected for a new indie app and does not mean the download is unsafe.

            - **macOS** (shows "app is damaged and can't be opened"): move the app to
              Applications, then run
              `xattr -cr "/Applications/Posture Tracker.app"` and open it normally.
            - **Windows** (SmartScreen "Windows protected your PC"): click **More info** →
              **Run anyway**.

            See the README for details.
