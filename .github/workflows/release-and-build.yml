name: Release & Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: posturetracker
  APP_NAME: Posture Tracker

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Cargo.toml version changed
        id: version_check
        run: |
          CURRENT_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version\s*=\s*"(.*)"/\1/')
          git show HEAD~1:Cargo.toml > /tmp/prev_cargo.toml 2>/dev/null || echo "" > /tmp/prev_cargo.toml
          PREV_VERSION=$(grep -m1 '^version' /tmp/prev_cargo.toml | sed -E 's/version\s*=\s*"(.*)"/\1/' || echo "")

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREV_VERSION"

          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ needs.version-check.outputs.tag }}"
          git push origin "${{ needs.version-check.outputs.tag }}"

  build:
    needs: [version-check, tag]
    if: needs.version-check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- Linux: build .deb package ----------
      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-24.04'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.os == 'ubuntu-24.04'
        run: cargo deb --target ${{ matrix.target }} --no-build

      - name: Upload .deb artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}-deb
          path: target/${{ matrix.target }}/debian/*.deb

      # ---------- Linux: raw binary ----------
      - name: Package Linux binary
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} dist/
          tar -czf dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.tar.gz -C dist ${{ env.BIN_NAME }}

      - name: Upload Linux binary artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}-binary
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.tar.gz

      # ---------- Windows: package .exe ----------
      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "dist/"
          Compress-Archive -Path "dist/${{ env.BIN_NAME }}.exe" -DestinationPath "dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip"

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip

      # ---------- macOS: build .app bundle ----------
      - name: Build .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          APP_DIR="dist/${{ env.APP_NAME }}.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} "$APP_DIR/Contents/MacOS/"
          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ env.BIN_NAME }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.${{ env.BIN_NAME }}</string>
              <key>CFBundleName</key>
              <string>${{ env.APP_NAME }}</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.version-check.outputs.version }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.version-check.outputs.version }}</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          cd dist
          zip -r "${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip" "${{ env.APP_NAME }}.app"

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip

  release:
    needs: [version-check, build]
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          name: ${{ needs.version-check.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
