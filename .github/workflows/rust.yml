name: Build & Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Change this to your binary name (the [[bin]] name in Cargo.toml)
  BIN_NAME: posturetracker
  # Change this to your app's display name / package name
  APP_NAME: Posture Tracker

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- Linux: build .deb package ----------
      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-24.04'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.os == 'ubuntu-24.04'
        run: cargo deb --target ${{ matrix.target }} --no-build

      - name: Upload .deb artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}-deb
          path: target/${{ matrix.target }}/debian/*.deb

      # ---------- Linux: raw binary (in addition to .deb) ----------
      - name: Package Linux binary
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} dist/
          tar -czf dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.tar.gz -C dist ${{ env.BIN_NAME }}

      - name: Upload Linux binary artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}-binary
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.tar.gz

      # ---------- Windows: package .exe ----------
      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "dist/"
          Compress-Archive -Path "dist/${{ env.BIN_NAME }}.exe" -DestinationPath "dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip"

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip

      # ---------- macOS: build .app bundle ----------
      - name: Build .app bundle
        if: matrix.os == 'macos-latest'
        run: |
          APP_DIR="dist/${{ env.APP_NAME }}.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} "$APP_DIR/Contents/MacOS/"
          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ env.BIN_NAME }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.${{ env.BIN_NAME }}</string>
              <key>CFBundleName</key>
              <string>${{ env.APP_NAME }}</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          cd dist
          zip -r "${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip" "${{ env.APP_NAME }}.app"

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.artifact }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
